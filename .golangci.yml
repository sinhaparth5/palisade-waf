version: "2"

linters:
  default: standard
  # Security and resource checks on top of the standard set (issue #278).
  # Suppress a finding only with a same-line //nolint:<linter> and a reason.
  enable:
    - gosec
    - bodyclose
    - errorlint
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck, which already runs with the
        # std-error-handling preset (Close, Write on a ResponseWriter, ...).
        - G104
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests drive httptest servers and hold fixed secrets on purpose.
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
