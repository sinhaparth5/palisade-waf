# Public demo: DEMO_DOMAIN=demo.example.com docker compose up -d --build
# (DNS pointing at this host, ports 80/443 open). Caddy serves the admin UI
# over HTTPS; the WAF's proxy sees synthetic traffic alone, so no visitor's
# IP lands in the shared logs. reset.sh wipes the demo data nightly.
name: palisade-demo

services:
  # Loads seed.json into a fresh volume (--replace makes reruns harmless).
  seed:
    build: ../..
    command: [config, import, --replace, --db, /data/waf.db, /seed.json]
    volumes: [data:/data, ./seed.json:/seed.json:ro]
    networks: [demo]

  waf:
    build: ../..
    command:
      - --db=/data/waf.db
      - --certs=/data/certs
      - --retention=1
      - --prune-interval=1h
      - --trusted-proxies=172.30.0.10,172.30.0.11
      - --admin-listen=:9090
      - --demo=${DEMO_LOGIN:-demo@palisade.dev:try-palisade}
    ports: ["127.0.0.1:9090:9090"]
    volumes: [data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      seed: {condition: service_completed_successfully}
    networks: [demo]
    restart: unless-stopped

  app:
    image: nginx:1.27-alpine
    networks: [demo]
    restart: unless-stopped

  traffic:
    image: curlimages/curl:8.10.1
    entrypoint: [sh, /traffic.sh]
    volumes: [./traffic.sh:/traffic.sh:ro]
    depends_on: [waf]
    networks:
      demo: {ipv4_address: 172.30.0.10}
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    environment: [DEMO_DOMAIN]
    ports: ["80:80", "443:443"]
    # A bind mount, not a volume, so reset.sh's down -v keeps the certs
    # (Let's Encrypt allows 5 duplicate certs a week).
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, ./.caddy-data:/data]
    depends_on: [waf]
    networks:
      demo: {ipv4_address: 172.30.0.11}
    restart: unless-stopped

volumes:
  data:

networks:
  demo:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
