{{- if and .Values.dbKey.create (not .Values.dbKey.existingSecret) }}
{{- $name := include "palisade.dbKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
  annotations:
    # The key outlives the release, like the volume: a new key can't open the
    # secrets sealed under the old one.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  # Never regenerate: copied from the Secret already in the cluster.
  {{ .Values.dbKey.secretKey }}: {{ index $existing.data .Values.dbKey.secretKey | required "the existing db-key Secret has no such key; set dbKey.secretKey to match" }}
  {{- else }}
  {{ .Values.dbKey.secretKey }}: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
