{{- if .Values.ingress.enabled }}
{{- if include "palisade.tls" . }}
{{- fail "ingress.enabled with Palisade's own TLS loops: plain HTTP only redirects to HTTPS. Turn tls off, or use a LoadBalancer Service" }}
{{- end }}
{{- include "palisade.ingress" (dict "root" . "values" .Values.ingress "name" (include "palisade.fullname" .) "port" "http" "path" "/") }}
{{- end }}
{{- if .Values.admin.ingress.enabled }}
{{- if not .Values.admin.port }}
{{- fail "admin.ingress needs admin.port: the admin UI has no Service of its own otherwise" }}
{{- end }}
---
{{- include "palisade.ingress" (dict "root" . "values" .Values.admin.ingress "name" (printf "%s-admin" (include "palisade.fullname" .)) "port" "admin" "path" "/admin") }}
{{- end }}
