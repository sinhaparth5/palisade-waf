apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "palisade.fullname" . }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
spec:
  # One pod only: SQLite on a ReadWriteOnce volume. Recreate stops the old pod
  # (and releases the volume) before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "palisade.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "palisade.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: palisade
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $backup := and .Values.backup.enabled .Values.persistence.enabled }}
      {{- if or $backup .Values.admin.email }}
      initContainers:
      {{- end }}
      {{- if $backup }}
        # Runs the new image before the new server starts, so the copy is of
        # the old schema. A first install has no DB yet and skips.
        - name: backup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - backup
            - --db=/data/waf.db
            - --dir=/data/backups
            - --keep={{ .Values.backup.keep }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      {{- if .Values.admin.email }}
        # Creates the first owner; a no-op once any admin exists.
        - name: setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - setup
            - --db=/data/waf.db
            - --admin-email={{ .Values.admin.email }}
            - --password-file=/etc/palisade/admin/{{ .Values.admin.passwordKey }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: admin
              mountPath: /etc/palisade/admin
              readOnly: true
      {{- end }}
      containers:
        - name: palisade
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --db=/data/waf.db
            - --certs=/data/certs
            - --listen=:{{ .Values.containerPort }}
            {{- if include "palisade.dbKeySecret" . }}
            - --db-key-file=/etc/palisade/key/{{ .Values.dbKey.secretKey }}
            {{- end }}
            {{- with .Values.tls.existingSecret }}
            - --listen-tls=:{{ $.Values.tls.containerPort }}
            - --tls-cert=/etc/palisade/tls/tls.crt
            - --tls-key=/etc/palisade/tls/tls.key
            {{- end }}
            {{- range $name, $value := .Values.flags }}
            {{- if or (kindIs "bool" $value) (kindIs "float64" $value) (kindIs "int64" $value) $value }}
            - {{ printf "--%s=%v" $name $value | quote }}
            {{- end }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if .Values.tls.existingSecret }}
            - name: https
              containerPort: {{ .Values.tls.containerPort }}
              protocol: TCP
            {{- end }}
          startupProbe:
            {{- include "palisade.probe" (dict "root" . "probe" .Values.startupProbe) | nindent 12 }}
          livenessProbe:
            {{- include "palisade.probe" (dict "root" . "probe" .Values.livenessProbe) | nindent 12 }}
          readinessProbe:
            {{- include "palisade.probe" (dict "root" . "probe" .Values.readinessProbe) | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if include "palisade.dbKeySecret" . }}
            - name: db-key
              mountPath: /etc/palisade/key
              readOnly: true
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: /etc/palisade/tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "palisade.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with include "palisade.dbKeySecret" . }}
        - name: db-key
          secret:
            secretName: {{ . }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.admin.email }}
        - name: admin
          secret:
            secretName: {{ required "admin.existingSecret is required with admin.email" .Values.admin.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ . }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
