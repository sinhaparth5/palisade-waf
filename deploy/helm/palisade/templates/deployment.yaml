apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "palisade.fullname" . }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
spec:
  # One pod only: SQLite on a ReadWriteOnce volume. Recreate stops the old pod
  # (and releases the volume) before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "palisade.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "palisade.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: palisade
        {{- if .Values.varnish.enabled }}
        checksum/vcl: {{ .Files.Get "files/default.vcl" | sha256sum }}
        {{- end }}
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k }}: {{ $v | toString | quote }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $backup := and .Values.backup.enabled .Values.persistence.enabled }}
      {{- $tls := include "palisade.tls" . }}
      {{- $selfSigned := and $tls (not .Values.tls.existingSecret) }}
      {{- if and .Values.tls.acme.domain (not .Values.admin.email) }}
      {{- fail "tls.acme.domain needs admin.email: the setup init container stores it" }}
      {{- end }}
      {{- $config := or .Values.config.existingSecret .Values.config.existingConfigMap }}
      {{- if and .Values.config.existingSecret .Values.config.existingConfigMap }}
      {{- fail "config.existingSecret and config.existingConfigMap both set; use one" }}
      {{- end }}
      {{- if not (has .Values.config.mode (list "seed" "replace")) }}
      {{- fail "config.mode must be seed or replace" }}
      {{- end }}
      {{- if or $backup .Values.admin.email $selfSigned $config }}
      initContainers:
      {{- end }}
      {{- if $backup }}
        # Runs the new image before the new server starts, so the copy is of
        # the old schema. A first install has no DB yet and skips.
        - name: backup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - backup
            - --db=/data/waf.db
            - --dir=/data/backups
            - --keep={{ .Values.backup.keep }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      {{- if $config }}
        # Before setup, so a seed import still sees an empty database.
        - name: config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - config
            - import
            - --db=/data/waf.db
            {{- if include "palisade.dbKeySecret" . }}
            - --db-key-file=/etc/palisade/key/{{ .Values.dbKey.secretKey }}
            {{- end }}
            - {{ eq .Values.config.mode "replace" | ternary "--replace" "--if-empty" }}
            - /etc/palisade/config/{{ .Values.config.key }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/palisade/config
              readOnly: true
            {{- if include "palisade.dbKeySecret" . }}
            - name: db-key
              mountPath: /etc/palisade/key
              readOnly: true
            {{- end }}
      {{- end }}
      {{- if .Values.admin.email }}
        # Creates the first owner; a no-op once any admin exists.
        - name: setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - setup
            - --db=/data/waf.db
            - --admin-email={{ .Values.admin.email }}
            - --password-file=/etc/palisade/admin/{{ .Values.admin.passwordKey }}
            {{- with .Values.tls.acme.domain }}
            - --domain={{ . }}
            - --acme-email={{ $.Values.tls.acme.email | default $.Values.admin.email }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: admin
              mountPath: /etc/palisade/admin
              readOnly: true
      {{- end }}
      {{- if $selfSigned }}
        # Fallback certificate for clients without SNI (the kubelet's probes,
        # access by IP) and names no other certificate covers.
        - name: tls-cert
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - gencert
            - --cert=/etc/palisade/tls/tls.crt
            - --key=/etc/palisade/tls/tls.key
            - --hosts={{ include "palisade.fullname" . }},{{ include "palisade.fullname" . }}.{{ .Release.Namespace }}.svc
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /etc/palisade/tls
      {{- end }}
      containers:
        - name: palisade
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --db=/data/waf.db
            - --certs=/data/certs
            - --listen=:{{ .Values.containerPort }}
            {{- if include "palisade.dbKeySecret" . }}
            - --db-key-file=/etc/palisade/key/{{ .Values.dbKey.secretKey }}
            {{- end }}
            {{- if $tls }}
            - --listen-tls=:{{ .Values.tls.containerPort }}
            - --tls-cert=/etc/palisade/tls/tls.crt
            - --tls-key=/etc/palisade/tls/tls.key
            {{- if .Values.tls.http3 }}
            - --listen-h3=:{{ .Values.tls.containerPort }}
            - --h3-advertise-port={{ .Values.service.httpsPort }}
            {{- end }}
            {{- end }}
            {{- if .Values.admin.port }}
            - --admin-listen=:{{ .Values.admin.port }}
            {{- end }}
            {{- with .Values.admin.allow }}
            - --admin-allow={{ join "," . }}
            {{- end }}
            {{- if .Values.accessLog.stdout }}
            {{- if index .Values.flags "access-log" }}
            {{- fail "accessLog.stdout and flags.access-log both set; use one" }}
            {{- end }}
            - --access-log=-
            {{- end }}
            {{- range $name, $value := .Values.flags }}
            {{- if or (kindIs "bool" $value) (kindIs "float64" $value) (kindIs "int64" $value) $value }}
            - {{ printf "--%s=%v" $name $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.clamav.enabled }}
            - --clamd=unix:///run/clamd/clamd.sock
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if $tls }}
            - name: https
              containerPort: {{ .Values.tls.containerPort }}
              protocol: TCP
            {{- if .Values.tls.http3 }}
            - name: h3
              containerPort: {{ .Values.tls.containerPort }}
              protocol: UDP
            {{- end }}
            {{- end }}
            {{- if .Values.admin.port }}
            - name: admin
              containerPort: {{ .Values.admin.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            {{- include "palisade.probe" (dict "root" . "probe" .Values.startupProbe) | nindent 12 }}
          livenessProbe:
            {{- include "palisade.probe" (dict "root" . "probe" .Values.livenessProbe) | nindent 12 }}
          readinessProbe:
            {{- include "palisade.probe" (dict "root" . "probe" .Values.readinessProbe) | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if include "palisade.dbKeySecret" . }}
            - name: db-key
              mountPath: /etc/palisade/key
              readOnly: true
            {{- end }}
            {{- if $tls }}
            - name: tls
              mountPath: /etc/palisade/tls
              readOnly: true
            {{- end }}
            {{- if .Values.clamav.enabled }}
            - name: clamd-socket
              mountPath: /run/clamd
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.clamav }}
        {{- if .enabled }}
        # clamd listens only on a unix socket in an emptyDir shared with
        # Palisade, never on the pod network. Scans fail open, so clamd
        # being down or still loading signatures never blocks uploads;
        # the shell restarts it in place instead of letting the container
        # exit and take the pod out of the Service's endpoints.
        - name: clamav
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              sed -e '/^TCPSocket/d' -e '/^TCPAddr/d' -e '/^LocalSocket/d' -e '/^User /d' -e '/^LogFile /d' /etc/clamav/clamd.conf > /tmp/clamd.conf
              printf 'LocalSocket /run/clamd/clamd.sock\nLocalSocketMode 666\nConcurrentDatabaseReload no\n' >> /tmp/clamd.conf
              sed -e '/^NotifyClamd/d' -e '/^UpdateLogFile/d' /etc/clamav/freshclam.conf > /tmp/freshclam.conf
              [ -f /var/lib/clamav/main.cvd ] || freshclam --foreground --stdout --config-file=/tmp/freshclam.conf
              freshclam --daemon --foreground --stdout --config-file=/tmp/freshclam.conf --checks={{ .checks }} & f=$!
              trap 'kill $f $p 2>/dev/null; exit 0' TERM INT
              while :; do rm -f /run/clamd/clamd.sock; clamd --foreground --config-file=/tmp/clamd.conf & p=$!; wait $p; sleep 2; done
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: clamd-socket
              mountPath: /run/clamd
            - name: clamav-db
              mountPath: /var/lib/clamav
            - name: clamav-tmp
              mountPath: /tmp
            - name: clamav-log
              mountPath: /var/log/clamav
        {{- end }}
        {{- end }}
        {{- with .Values.varnish }}
        {{- if .enabled }}
        # Shares the pod's loopback with Palisade, so the Varnish addresses
        # in Settings stay 127.0.0.1:6081 and :6082. While varnishd is down
        # Palisade serves cached services straight from the backend (fail
        # open), so the shell restarts it in place instead of letting the
        # container exit: a crashed container would take the pod out of the
        # Service's endpoints.
        - name: varnish
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          command:
            - sh
            - -c
            - trap 'kill $p 2>/dev/null; exit 0' TERM INT; while :; do varnishd -F "$@" & p=$!; wait $p; sleep 2; done
            - varnishd
          args:
            - -a
            - 127.0.0.1:6081
            - -f
            - /etc/varnish/default.vcl
            - -s
            - malloc,{{ .size }}
            # Same limits as install.sh: big backend headers (issue #212).
            - -p
            - http_resp_hdr_len=32k
            - -p
            - http_resp_size=64k
            - -p
            - http_req_hdr_len=32k
            - -p
            - http_req_size=64k
            - -p
            - workspace_backend=128k
            - -p
            - workspace_client=128k
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: varnish-vcl
              mountPath: /etc/varnish
              readOnly: true
            # Working directory: shared memory log and compiled VCL.
            - name: varnish-work
              mountPath: /var/lib/varnish
        {{- end }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "palisade.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with include "palisade.dbKeySecret" . }}
        - name: db-key
          secret:
            secretName: {{ . }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.admin.email }}
        - name: admin
          secret:
            secretName: {{ required "admin.existingSecret is required with admin.email" .Values.admin.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.config.existingSecret }}
        - name: config
          secret:
            secretName: {{ . }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.config.existingConfigMap }}
        - name: config
          configMap:
            name: {{ . }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0400
        {{- else if $tls }}
        - name: tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if .Values.clamav.enabled }}
        - name: clamd-socket
          emptyDir:
            sizeLimit: 1Mi
        - name: clamav-db
          emptyDir:
            sizeLimit: 1Gi
        - name: clamav-tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: clamav-log
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- if .Values.varnish.enabled }}
        - name: varnish-vcl
          configMap:
            name: {{ include "palisade.fullname" . }}-varnish
        - name: varnish-work
          emptyDir:
            sizeLimit: 512Mi
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
