{{- with .Values.metrics.serviceMonitor }}
{{- if .enabled }}
{{- if not .existingSecret }}
{{- fail "metrics.serviceMonitor.existingSecret: name the Secret holding a read-only API key" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "palisade.fullname" $ }}
  labels:
    {{- include "palisade.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "palisade.selectorLabels" $ | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ $.Release.Namespace }}]
  endpoints:
    - path: /admin/api/v1/metrics
      interval: {{ .interval }}
      scrapeTimeout: {{ .scrapeTimeout }}
      {{- if $.Values.admin.port }}
      port: admin
      {{- else if include "palisade.tls" $ }}
      # Plain HTTP only redirects; the certificate may be self-signed.
      port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      {{- else }}
      port: http
      {{- end }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .existingSecret }}
          key: {{ .secretKey }}
{{- end }}
{{- end }}
