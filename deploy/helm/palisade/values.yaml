# Palisade keeps its state in one SQLite file plus in-memory counters, so the
# chart runs exactly one pod. Scaling out needs palisade-pro.

image:
  repository: ghcr.io/sinhaparth5/palisade-waf
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Serve flags, rendered as --name=value (palisade --help lists them all).
# Empty values are skipped. --db, --certs and --listen are set by the chart
# so everything lands on the persistent volume.
flags:
  retention: 30
  # No cron in the pod, so prune request logs in-process.
  prune-interval: 24h
  max-conns-per-ip: 256
  # Whose X-Forwarded-For to believe: the pod CIDR behind an in-cluster
  # Ingress controller (README.md, "Client IP"). Unset, every request
  # seems to come from the controller.
  trusted-proxies: ""
  trusted-crawlers: ""
  waf-rules: ""
  geo-db: ""
  access-log: ""

# nginx combined access lines on stdout, for kubectl logs and node log
# agents (Fluent Bit, Promtail, Vector). Nothing is written to /data. Server
# logs go to stderr, so a shipper can split the two by stream.
accessLog:
  stdout: false

# Key that seals stored secrets (TOTP, webhook and email tokens) in waf.db,
# passed as --db-key-file. Losing it makes those secrets unreadable.
dbKey:
  # Use your own Secret (at least 32 bytes, e.g. openssl rand -hex 32).
  # Required with GitOps tools that can't run Helm's lookup (Argo CD).
  existingSecret: ""
  secretKey: db.key
  # Without existingSecret the chart creates <release>-palisade-db-key once,
  # reuses it on every upgrade and leaves it behind on uninstall, next to
  # the volume it belongs to.
  create: true

# First owner account, created by an init container running palisade setup
# when the DB has no admin yet. An existing admin is never changed; reset a
# password with palisade setup --reset-password (see README.md).
admin:
  email: ""
  # Secret holding the password (12+ characters).
  existingSecret: ""
  passwordKey: password
  # The admin UI, API and metrics listen only on this port (--admin-listen,
  # plain HTTP) behind their own ClusterIP Service. /admin on the public
  # Service then goes to the proxy like any other path. 0 serves the admin
  # UI on the public port instead.
  port: 9090
  # Client IPs or CIDRs that may use the admin UI (--admin-allow); everyone
  # else gets a 404. Empty: anyone who can reach the port.
  allow: []
  service:
    port: 9090
    annotations: {}
  # A separate Ingress for the admin Service, e.g. on an internal ingress
  # class, a VPN-only host or behind an SSO proxy. Only /admin is routed.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

# HTTPS served by Palisade itself (README.md, "TLS"). Leave it off to
# terminate TLS at an Ingress instead. Setting any option below turns it on.
# Plain HTTP on containerPort then only redirects to HTTPS and answers ACME
# challenges.
tls:
  enabled: false
  # A kubernetes.io/tls Secret (yours, or cert-manager's), served for every
  # name no uploaded or ACME certificate covers. A renewed Secret is picked
  # up within about two minutes, no restart. Empty: an init container makes
  # a self-signed one at every start.
  existingSecret: ""
  containerPort: 8443
  # Let's Encrypt for the primary domain (setup --domain), stored by the init
  # container (needs admin.email). Services turn ACME on in the admin UI.
  # Port 80 of the Service must be reachable from the internet, or issuing
  # and renewing fail. Certificates are kept in /data/certs on the volume.
  acme:
    domain: ""
    # Contact address; defaults to admin.email.
    email: ""
  # HTTP/3 (QUIC) on UDP containerPort, advertised to browsers as
  # service.httpsPort. Services opt in in the admin UI. The load balancer
  # must carry UDP and TCP on the same IP.
  http3: false

# Appended after the rendered flags.
extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

persistence:
  enabled: true
  # Mount a PVC that already exists (an earlier install, another tool)
  # instead of creating one. size/storageClass/accessMode are then ignored.
  existingClaim: ""
  # helm uninstall leaves the PVC (and the database) in place. Delete it on
  # purpose with: kubectl delete pvc <release>-palisade-data
  keepOnUninstall: true
  size: 2Gi
  # "" uses the cluster's default StorageClass.
  storageClass: ""
  accessMode: ReadWriteOnce
  annotations: {}

service:
  # ClusterIP behind an Ingress, or LoadBalancer to expose Palisade directly.
  type: ClusterIP
  port: 80
  # Used with TLS on (TCP, plus UDP for tls.http3).
  httpsPort: 443
  annotations: {}
  # Local keeps the client's source IP on a LoadBalancer/NodePort service.
  externalTrafficPolicy: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

containerPort: 8080

# An Ingress sending every path of these hosts to Palisade, for TLS
# terminated at the Ingress controller (tls above stays off). Trust the
# controller in flags.trusted-proxies (README.md, "Client IP").
ingress:
  enabled: false
  className: ""
  # e.g. cert-manager.io/cluster-issuer: letsencrypt
  annotations: {}
  # Every name Palisade serves. Empty: one rule for any host.
  hosts: []
  # - secretName: palisade-ingress-tls
  #   hosts: [waf.example.com]
  tls: []

# An init container copies waf.db to /data/backups/waf-<UTC time>.db every
# time the pod starts, before the server (possibly a newer version) opens and
# migrates it. Needs persistence; each backup is about the size of the DB.
backup:
  enabled: true
  keep: 5

podAnnotations: {}
podLabels: {}

# Matches the image: UID/GID 65532, read-only root, every write goes to /data.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Palisade drains in-flight requests for 10s on SIGTERM.
terminationGracePeriodSeconds: 30

# The first boot builds the CRS engines and creates the DB; give it time.
startupProbe:
  httpGet:
    path: /_cz/readyz
    port: http
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /_cz/healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /_cz/readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Varnish as a sidecar for the per-service Cache (README.md, "Varnish").
# Turn it on in the admin UI afterwards: Settings, Varnish Cache, then
# Cache on each service. The VCL is files/default.vcl.
varnish:
  enabled: false
  image:
    repository: varnish
    tag: "7.6"
    pullPolicy: IfNotPresent
  # Cache memory (varnishd -s malloc). Count it in resources.limits.memory
  # plus about 100Mi for varnishd itself.
  size: 256m
  # The image's varnish user. Root filesystem read-only; the working
  # directory is an emptyDir.
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 512Mi

# Prometheus Operator and Grafana (README.md, "Metrics"). Prometheus scrapes
# /admin/api/v1/metrics on the admin port with a read-only API key.
metrics:
  serviceMonitor:
    enabled: false
    # Secret in the release namespace holding the API key (Settings, API
    # keys, read-only): kubectl create secret generic palisade-metrics
    # --from-literal=token=cwaf_...
    existingSecret: ""
    secretKey: token
    interval: 30s
    scrapeTimeout: 10s
    # Labels your Prometheus selects ServiceMonitors by, e.g.
    # release: kube-prometheus-stack.
    labels: {}
  # Dashboard ConfigMap for the Grafana sidecar (grafana_dashboard: "1").
  # The dashboard is files/grafana-dashboard.json.
  dashboard:
    enabled: false
    # Where the sidecar looks; empty: the release namespace.
    namespace: ""
    labels:
      grafana_dashboard: "1"
    # e.g. grafana_folder: Palisade
    annotations: {}
  # Alerts: pod down, block rate spike, backend down.
  prometheusRule:
    enabled: false
    labels: {}
    # Share of requests blocked or rate limited, over 10 minutes.
    blockRatio: 0.5
    # Below this many requests per second the block ratio doesn't alert.
    minRate: 1

# Limits who can reach the pod. Needs a CNI that enforces NetworkPolicy
# (GKE Dataplane V2, Calico, Cilium). kubectl port-forward is not affected.
networkPolicy:
  enabled: false
  # Peers (NetworkPolicyPeer) that may reach the public ports, e.g. the
  # ingress controller's namespace. Empty: anyone, which a LoadBalancer
  # Service with externalTrafficPolicy Local needs.
  publicFrom: []
  # Peers that may reach the admin port. Empty: none.
  adminFrom: []
  # Rules (NetworkPolicyEgressRule) for where Palisade may connect, on top
  # of DNS. Empty: anywhere. Restricting it, include the backends and
  # anything you use of Let's Encrypt, api.pwnedpasswords.com, webhooks,
  # email, JWKS URLs and threat feeds.
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
