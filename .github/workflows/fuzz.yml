name: fuzz

# Runs every Fuzz* target (make fuzz) weekly and on demand (issue #265). Not
# on push: a short fuzz run per PR finds little and slows every merge. A
# failing input is uploaded as an artifact; commit it under the package's
# testdata/fuzz/<Target>/ with the fix so plain `go test` keeps the case.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Time per target (Go duration)'
        default: '2m'

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Generate embedded assets
        run: go generate ./...

      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: make fuzz FUZZTIME="$FUZZTIME"

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
