name: govulncheck

# Fails when Palisade's code actually reaches a known vulnerability in a
# dependency or the Go standard library. The weekly run catches advisories
# published after the last push; GitHub emails the failure to the maintainer.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Go as the release builds in ci.yml, so stdlib findings match
      # what actually ships.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Generate embedded assets
        run: go generate ./...

      # IGNORE lists advisories reviewed as not applicable. govulncheck has no
      # ignore flag, so the JSON output is filtered and any other called
      # vulnerability still fails the job. Empty since the move to echo v5
      # (issue #277); add an id only with a note on why it doesn't apply.
      - name: Run govulncheck
        env:
          IGNORE: ""
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > vuln.json
          called=$(jq -r 'select(.finding.trace[0].function != null) | .finding.osv' vuln.json | sort -u)
          bad=$(comm -23 <(echo "$called") <(tr ' ' '\n' <<<"$IGNORE" | sort -u) | sed '/^$/d')
          [ -n "$called" ] && echo "Called (incl. ignored): $called"
          if [ -n "$bad" ]; then
            echo "::error::Unignored vulnerabilities: $bad"
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... || true
            exit 1
          fi
