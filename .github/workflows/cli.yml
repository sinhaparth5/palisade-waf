name: CLI

on:
  push:
    branches:
      - main
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # libssl-dev ships on the runner image; no apt step, so a dead Ubuntu
      # mirror can't fail the build.
      - name: Configure
        run: cmake -S cli -B cli/build

      - name: Build
        run: cmake --build cli/build

      - name: Test
        run: ctest --test-dir cli/build --output-on-failure

      - name: Smoke
        run: cli/build/palisade-cli --version
