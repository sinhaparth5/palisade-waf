{{define "log-row"}}
<div data-log-id="{{.ID}}" tabindex="0" role="button" aria-label="{{.Method}} {{.Path}}, status {{.Status}}{{if .Blocked}}, blocked{{end}}. Show details"
  class="flex min-w-[920px] items-center gap-[22px] px-6 py-2.5 border-b border-line text-[13px] transition-colors duration-100 cursor-pointer focus-visible:outline-offset-[-3px] aria-busy:opacity-60 aria-busy:cursor-progress aria-[current=true]:bg-side-active aria-[current=true]:shadow-[inset_3px_0_0_var(--fn-edge)] {{if .Blocked}}bg-red-50 hover:bg-red-100{{else}}hover:bg-surface{{end}}">
  <span class="font-mono text-slate-600 shrink-0 w-[104px] whitespace-nowrap tabular-nums">{{fmtTime .Timestamp}}</span>
  <span class="shrink-0 w-[94px] truncate" title="{{.AppName}}">{{.AppName}}</span>
  <span class="shrink-0 w-[150px] flex items-center gap-[7px]">
    {{if .Country}}<span class="{{flagClass .Country}} w-4 h-3 bg-cover inline-block shrink-0"></span>{{end}}
    <span class="font-mono truncate">{{.RealIP}}</span>
  </span>
  <span class="shrink-0 w-[58px] font-mono text-[12px]">{{.Method}}</span>
  <span class="font-mono flex-1 text-slate-600 truncate" title="{{.Path}}">{{.Path}}</span>
  <span class="shrink-0 w-[50px] flex items-center justify-end gap-1.5 font-mono tabular-nums">
    <span class="h-2 w-2 shrink-0 rounded-full {{if ge .Status 500}}bg-danger{{else if ge .Status 400}}bg-warning{{else if ge .Status 300}}bg-info{{else}}bg-success{{end}}"></span>{{.Status}}
  </span>
  <span class="font-mono shrink-0 w-[50px] text-right text-slate-500 tabular-nums">{{fmtDur .Duration}}</span>
  <span class="shrink-0 w-20 font-mono text-[12px]">
    {{if .Blocked}}<span class="uppercase text-red-600">{{if .RuleID}}#{{.RuleID}}{{else}}block{{end}}</span>{{end}}
  </span>
</div>
{{end}}
