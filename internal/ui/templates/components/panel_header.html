{{define "panel-header"}}
<div class="flex items-center gap-3 border-b border-line pb-3 {{if .Mb}}{{.Mb}}{{else}}mb-5{{end}}">
  <i class="hgi hgi-stroke hgi-rounded {{.Icon}} text-base {{if .Color}}{{.Color}}{{else}}text-ink{{end}}"></i>
  <h2 class="text-[14px] text-ink">{{.Title}}</h2>
</div>
{{end}}
