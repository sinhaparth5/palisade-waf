{{define "confirm-modal"}}
<div id="confirm-modal-overlay"
     class="hidden flex fixed inset-0 z-[300] items-center justify-center bg-black/55 p-4 fade-in">
  <div class="relative mobile-safe-modal max-w-[380px] bg-card border border-edge shadow-[0_24px_70px_rgba(0,0,0,.25)] p-5 sm:p-6 modal-pop">

    <div class="flex items-center gap-3 mb-4">
      <div class="w-9 h-9 border border-red-300 bg-red-50 flex items-center justify-center shrink-0">
        <i class="hgi hgi-stroke hgi-rounded hgi-alert-02 text-base text-red-600"></i>
      </div>
      <h2 class="text-[15px] text-ink">Confirm removal</h2>
    </div>

    <p id="confirm-modal-message"
       class="text-[14px] leading-[1.6] mb-6 text-slate-600"></p>

    <div class="flex gap-2.5">
      <button id="confirm-modal-cancel" type="button"
        class="flex-1 py-[9px] text-[14px] font-medium cursor-pointer font-mono uppercase tracking-[.04em] rounded-sm bg-transparent text-ink border border-edge hover:bg-surface transition-colors duration-150">
        Cancel
      </button>
      <button id="confirm-modal-ok" type="button"
        class="flex-1 py-[9px] text-[14px] font-medium cursor-pointer font-mono uppercase tracking-[.04em] rounded-sm bg-red-600 text-white border border-red-600 hover:bg-red-700 transition-colors duration-150">
        Remove
      </button>
    </div>
  </div>
</div>
{{end}}
