{{define "card-header"}}
<div class="flex items-center justify-between gap-4 border-b border-edge px-5 py-4 sm:px-6">
  <div>
    <p class="label-mono mb-[2px]">{{.Cat}}</p>
    <h3 class="font-mono text-[15px] font-medium uppercase tracking-[.04em] text-ink">{{.Title}}</h3>
  </div>
  <span class="shrink-0 rounded-md border border-edge px-2.5 py-1 font-mono text-[11px] font-medium uppercase tracking-[.06em] text-ink">{{.Badge}}</span>
</div>
{{end}}
