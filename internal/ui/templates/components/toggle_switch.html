{{define "toggle-switch"}}
<span class="relative inline-block">
  <input type="checkbox" name="{{.Name}}" value="1" class="peer sr-only"
         {{- if .ID}} id="{{.ID}}"{{end}}
         {{- if .Checked}} checked{{end}}
         {{- if .Controls}} data-controls="{{.Controls}}"{{end}}/>
  <span class="block w-10 h-6 border border-edge bg-slate-200 peer-checked:bg-ink rounded-full transition-colors duration-200 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-info"></span>
  <span class="absolute left-1 top-1 w-4 h-4 peer-active:w-5 bg-card border border-edge rounded-full transition-all duration-200 peer-checked:translate-x-4"></span>
</span>
{{end}}
