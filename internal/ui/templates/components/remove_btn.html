{{define "remove-btn"}}
<button hx-delete="{{.URL}}"
        hx-target="{{.Target}}"
        hx-swap="innerHTML"
        hx-confirm="{{.Confirm}}"
        class="inline-flex items-center gap-[5px] font-mono text-[11px] font-medium uppercase tracking-[.06em] text-red-600 bg-transparent border border-red-300 rounded-sm px-3 py-[5px] cursor-pointer transition-colors duration-150 hover:bg-red-50 shrink-0">
  <i class="hgi hgi-stroke hgi-rounded {{if .Icon}}{{.Icon}}{{else}}hgi-delete-02{{end}} text-xs"></i>
  {{if .Label}}{{.Label}}{{else}}Remove{{end}}
</button>
{{end}}
