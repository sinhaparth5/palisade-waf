<!doctype html>
<!-- The sign-in page, its own build (vite build --mode login). Rendered by Go
     as an html/template (internal/ui/app.go renderLoginPage). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · Palisade</title>
    <link rel="icon" type="image/svg+xml" href="{{.AdminPath}}/static/imgs/logo.svg" vite-ignore />
    <script src="{{.AdminPath}}/static/js/theme.js?v={{.Asset}}" vite-ignore></script>
    <link rel="stylesheet" href="{{.AdminPath}}/static/vendor/fonts/fonts.css?v={{.Asset}}" vite-ignore />
  </head>
  <body data-admin="{{.AdminPath}}" data-stage="{{.Stage}}" data-error="{{.Error}}" data-notice="{{.Notice}}" data-sso="{{.SSO}}" data-demo-email="{{.DemoEmail}}" data-demo-pass="{{.DemoPass}}" data-passkeys="{{.Passkeys}}" data-email-code="{{.EmailCode}}" data-invite-email="{{.InviteEmail}}" data-token="{{.Token}}" data-ext-login="{{.ExtLogin}}" data-ext-login-path="{{.ExtLoginPath}}">
    <div id="palisade"></div>
    <script type="module" src="/src/login.tsx"></script>
  </body>
</html>
