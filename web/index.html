<!doctype html>
<!-- Rendered by Go as an html/template (internal/ui/app.go), which fills the template fields. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{.BrandName}}</title>
    <link rel="icon" type="image/svg+xml" href="{{.AdminPath}}{{.BrandLogo}}" vite-ignore />
    <!-- Saved theme, applied before first paint (shared with the Pro page). -->
    <script src="{{.AdminPath}}/static/js/theme.js?v={{.Asset}}" vite-ignore></script>
    <link rel="stylesheet" href="{{.AdminPath}}/static/vendor/fonts/fonts.css?v={{.Asset}}" vite-ignore />
    <link rel="stylesheet" href="{{.AdminPath}}/static/vendor/hugeicons/hgi-stroke-rounded.css?v={{.Asset}}" vite-ignore />
    <link rel="stylesheet" href="{{.AdminPath}}/static/vendor/flag-icons/css/flag-icons.min.css?v={{.Asset}}" vite-ignore />
    {{if .BrandCSS}}<link rel="stylesheet" href="{{.AdminPath}}{{.BrandCSS}}" vite-ignore />{{end}}
  </head>
  <body data-admin="{{.AdminPath}}" data-brand="{{.BrandName}}" data-brand-logo="{{.AdminPath}}{{.BrandLogo}}" data-csrf="{{.CSRF}}" data-role="{{.Role}}" data-email="{{.Email}}" data-demo="{{.Demo}}" data-version="{{.Version}}" data-waf="{{.WAF}}" data-pro="{{.Pro}}" data-scoped="{{.Scoped}}" data-nonce="{{.Nonce}}">
    <div id="palisade"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
